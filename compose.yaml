services:
  app:
    container_name: telegram-bot
    build:
      context: .
      dockerfile: Dockerfile.bot
    environment:
      DOTNET_ENVIRONMENT: Production
      TelegramBot__Token: ${TelegramBotToken:?Set TelegramBotToken in the environment or .env file}
      LiteDb__DatabasePath: /data/secretsanta.db
    volumes:
      - secret_santa_data:/data
    restart: unless-stopped

  api:
    container_name: telegram-api
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DOTNET_ENVIRONMENT: Production
      TelegramBot__Token: ${TelegramBotToken:?Set TelegramBotToken in the environment or .env file}
      LiteDb__DatabasePath: /data/secretsanta.db
      ASPNETCORE_HTTP_PORTS: 8080
    ports:
      - "5080:8080"
    volumes:
      - secret_santa_data:/data
    restart: unless-stopped

volumes:
  secret_santa_data:
    name: secretsanta_litedb