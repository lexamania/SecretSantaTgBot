services:
  app:
    container_name: telegram-bot
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - BOT_TOKEN=${TG_BOT_TOKEN}
      - LiteDb__DatabasePath=/data/secretsanta.db
    volumes:
      - secret_santa_data:/data
    restart: unless-stopped

volumes:
  secret_santa_data:
    name: secretsanta_litedb