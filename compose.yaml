services:
  app:
    container_name: telegram-bot
    build:
      context: .
      dockerfile: Dockerfile
    environment:
     - DOTNET_ENVIRONMENT=Production
     - TelegramBot__Token=${TelegramBotToken}
     - LiteDb__DatabasePath=/data/secretsanta.db
    volumes:
      - secret_santa_data:/data
    restart: unless-stopped

volumes:
  secret_santa_data:
    name: secretsanta_litedb